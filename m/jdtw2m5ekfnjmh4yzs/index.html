<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>🔒 Запись встречи</title><style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#86868b;--line:#e8e8ed;--hi:#eef4ff;--card:#f5f5f7;--acc:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#f2f2f2;--mut:#8b8b90;--line:#2a2a2e;--hi:#1d2a40;--card:#1c1c1f;--acc:#5b8def}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}header{padding:20px 0 8px}h1{font-size:20px;margin:0 0 4px}
.when{color:var(--mut);font-size:14px}.chips{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid;border-radius:20px;padding:1px 10px;font-size:13px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:14px}
.tab{background:none;border:0;color:var(--mut);font:inherit;padding:10px 0;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--fg);font-weight:600}
.player{position:sticky;top:0;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);z-index:2}
.bar{width:100%;accent-color:var(--acc)}.ctl{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut)}
.btns{display:flex;gap:14px;align-items:center}.btns button{background:var(--card);border:0;color:var(--fg);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}
.btns .pp{width:44px;height:44px;border-radius:50%;font-size:18px}
.u{padding:10px 12px;border-radius:10px;cursor:pointer;margin:2px -12px}.u:hover{background:var(--card)}.u.on{background:var(--hi)}
.meta{display:flex;gap:10px;font-size:13px}.t{color:var(--mut);font-variant-numeric:tabular-nums}.sp{font-weight:600}
.u p{margin:2px 0 0}.pane{display:none}.pane.on{display:block}#sum h3{font-size:15px;margin:22px 0 6px}#sum li{margin:4px 0}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);margin:12px 0}
button.go{width:100%;font:inherit;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
.err{color:#d9480f;font-size:14px;min-height:20px}.lockbox{padding-top:24px}
</style></head><body><div class="wrap" id="app">
<div class="lockbox"><h1>🔒 Запись встречи</h1><div class="when">Запись и транскрипт защищены паролем</div>
<form id="f"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
<div class="err" id="err"></div><button class="go" type="submit">Открыть</button></form></div></div>
<script>
const KEY='ma_pw:'+location.pathname, COLORS=["#2f6fde","#d9480f","#2b8a3e","#ae3ec9","#e67700","#0c8599","#c2255c","#5f3dc4"];
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=s=>{s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};
async function dec(buf,pw){const b=new Uint8Array(buf),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct))}
function sd(d){const m=(d||'').match(/^(\d\d)\.(\d\d)\.(\d{4})$/);return m&&+m[3]===new Date().getFullYear()?m[1]+'.'+m[2]:(d||'')}
function render(d){
 const us=d.utts||[],res=d.res||{},sp=[...new Set(us.map(u=>u.speaker))].sort(),col={};sp.forEach((s,i)=>col[s]=COLORS[i%COLORS.length]);
 const ul=xs=>xs&&xs.length?'<ul>'+xs.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'';
 let sum='';if((res.summary||[]).length)sum+='<h3>Кратко</h3>'+ul(res.summary);
 for(const t of res.details||[])sum+='<h3>'+E(t.topic)+'</h3>'+ul(t.points);
 if((res.decisions||[]).length)sum+='<h3>Решения</h3>'+ul(res.decisions);
 if((res.tasks||[]).length)sum+='<h3>Задачи</h3>'+ul(res.tasks.map(t=>(t.task||'')+' — 👤 '+(t.owner||'не назначен')+' · 📅 '+(sd(t.deadline)||'без срока')));
 document.getElementById('app').innerHTML='<header><h1>'+E(d.title)+'</h1><div class="when">'+E(d.when)+'</div><div class="chips">'+
  sp.map(s=>'<span class="chip" style="border-color:'+col[s]+';color:'+col[s]+'">'+E(s)+'</span>').join('')+'</div></header>'+
  '<div class="tabs"><button class="tab on" data-p="tr">Транскрипт</button><button class="tab" data-p="sum">Выжимка</button></div>'+
  '<div class="pane on" id="tr"><div class="player"><input class="bar" id="bar" type="range" min="0" max="100" value="0" step="0.1">'+
  '<div class="ctl"><span id="cur">загружаю запись…</span><div class="btns"><button id="b15">−15</button><button class="pp" id="pp">▶</button><button id="f15">+15</button></div>'+
  '<button id="sp" style="background:none;border:0;color:inherit;font:inherit;cursor:pointer">1×</button></div><audio id="a" preload="metadata"></audio></div>'+
  us.map(u=>'<div class="u" data-t="'+u.offset+'"><div class="meta"><span class="t">'+f(u.offset)+'</span><span class="sp" style="color:'+col[u.speaker]+'">'+E(u.speaker)+'</span></div><p>'+E(u.text)+'</p></div>').join('')+
  '</div><div class="pane" id="sum">'+(sum||'<p>—</p>')+'</div>';
 const a=document.getElementById('a'),bar=document.getElementById('bar'),cur=document.getElementById('cur'),pp=document.getElementById('pp'),els=[...document.querySelectorAll('.u')];
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});
 pp.onclick=()=>a.paused?a.play():a.pause();a.onplay=()=>pp.textContent='❚❚';a.onpause=()=>pp.textContent='▶';
 document.getElementById('b15').onclick=()=>a.currentTime=Math.max(0,a.currentTime-15);document.getElementById('f15').onclick=()=>a.currentTime+=15;
 const speeds=[1,1.25,1.5,2];let si=0;document.getElementById('sp').onclick=e=>{si=(si+1)%speeds.length;a.playbackRate=speeds[si];e.target.textContent=speeds[si]+'×'};
 bar.oninput=()=>{if(a.duration)a.currentTime=bar.value/100*a.duration};
 els.forEach(u=>u.onclick=()=>{a.currentTime=+u.dataset.t;a.play()});
 let last=null;a.ontimeupdate=()=>{if(a.duration)bar.value=a.currentTime/a.duration*100;cur.textContent=f(a.currentTime)+' / '+f(a.duration);
 let c=null;for(const u of els){if(+u.dataset.t<=a.currentTime+0.2)c=u;else break}if(c!==last){last&&last.classList.remove('on');c&&c.classList.add('on');last=c}};
 return a}
async function open_(pw,silent){const err=document.getElementById('err');err.textContent='Открываю…';
 let d;try{const r=await fetch('payload.enc',{cache:'no-store'});d=JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer(),pw)))}
 catch(x){err.textContent=silent?'':'Неверный пароль';try{localStorage.removeItem(KEY)}catch(_){}return}
 try{localStorage.setItem(KEY,pw)}catch(_){}
 const a=render(d);
 try{const au=d.audio||{};const src=au.drive?'https://www.googleapis.com/drive/v3/files/'+au.drive+'?alt=media&key='+au.key:'audio.enc';
  document.getElementById('cur').textContent='загружаю запись…';const r=await fetch(src);if(!r.ok){document.getElementById('cur').textContent='аудио нет';return}
  const bytes=await dec(await r.arrayBuffer(),pw);a.src=URL.createObjectURL(new Blob([bytes],{type:'audio/mp4'}));
  document.getElementById('cur').textContent='00:00'}catch(x){document.getElementById('cur').textContent='аудио не загрузилось'}}
document.getElementById('f').onsubmit=ev=>{ev.preventDefault();open_(document.getElementById('pw').value,false)};
let saved=null;try{saved=localStorage.getItem(KEY)}catch(_){}if(saved)open_(saved,true);
</script></body></html>
